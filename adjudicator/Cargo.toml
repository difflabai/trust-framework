[package]
name = "adjudicator"
version = "0.1.0"
edition = "2021"
description = "A behavior adjudicator for AI agent systems"
license = "MIT"
repository = "https://github.com/difflabai/trust-framework"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
