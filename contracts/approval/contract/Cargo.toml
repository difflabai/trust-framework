[package]
name = "approval-contract"
version = "0.1.0"
edition = "2021"
description = "NEAR contract recording agent action requests and approver sign-offs as public proofs"
publish = false
repository = "https://github.com/difflabai/trust-framework"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
approval-core = { path = "../core", features = ["borsh"] }
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

# `cargo near build reproducible-wasm` builds inside this pinned image, so the
# wasm's code hash can be reproduced from the source at a given commit.
# Update image and digest together.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
