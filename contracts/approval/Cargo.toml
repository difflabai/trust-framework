[workspace]
members = ["core", "contract", "sandbox"]
# The sandbox tests need the built wasm and a NEAR sandbox binary; run them
# explicitly with `cargo test -p approval-sandbox-tests`.
default-members = ["core", "contract"]
resolver = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
