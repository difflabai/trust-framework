name: approval-contract

# Docs-only changes (*.md: no crate includes one, so they cannot change the
# wasm or a test) skip the run.
on:
  push:
    branches: [main]
    paths:
      - "contracts/approval/**"
      - "!contracts/approval/**/*.md"
      - ".github/workflows/approval-contract.yml"
  pull_request:
    paths:
      - "contracts/approval/**"
      - "!contracts/approval/**/*.md"
      - ".github/workflows/approval-contract.yml"

permissions:
  contents: read

concurrency:
  group: approval-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_NEAR_VERSION: "0.22.0"
  # sha256 of cargo-near-x86_64-unknown-linux-gnu.tar.gz for that release.
  CARGO_NEAR_SHA256: "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a"
  # sha256 of cargo-near-aarch64-apple-darwin.tar.gz, for macOS runners
  # in the CI pool.
  CARGO_NEAR_SHA256_MACOS_ARM64: "55bd219c28c6996512a7c3836519f160b27b73a723f087634bf16f8a0bd48c8a"

defaults:
  run:
    working-directory: contracts/approval

jobs:
  check:
    name: fmt, clippy, unit tests
    # Jobs run on the CI pool. vars.CI_RUNNER selects the pool;
    # unset, this falls back to GitHub-hosted Linux.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Cap each job so a hang doesn't hold a CI pool runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # On a CI pool runner, install the pin and select it for this job only,
      # so the job does not change the runner's default toolchain.
      - name: Install the pinned Rust toolchain for this job
        if: runner.environment == 'self-hosted'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: runner.environment == 'github-hosted'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      # rust-cache's post step prunes CARGO_HOME. A CI pool runner's
      # CARGO_HOME is shared and already persists, so only use rust-cache
      # on GitHub-hosted runners.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: contracts/approval
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p approval-core --locked
      - run: cargo test -p approval-core --features borsh --locked
      - run: cargo test -p approval-contract --locked

  wasm:
    name: reproducible wasm
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Longer than the others: the CI pool may run the amd64 build image
    # under emulation.
    timeout-minutes: 45
    steps:
      # Build the PR head commit itself (not the merge commit), so the
      # recorded source snapshot is a commit that exists on a branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Fetch the release binary and check it against a committed hash
      # rather than piping the installer script into sh. Bump the hash
      # together with CARGO_NEAR_VERSION.
      - name: Install cargo-near
        working-directory: ${{ runner.temp }}
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) target=x86_64-unknown-linux-gnu sha256=$CARGO_NEAR_SHA256 ;;
            macOS-ARM64) target=aarch64-apple-darwin sha256=$CARGO_NEAR_SHA256_MACOS_ARM64 ;;
            *) echo "::error::No pinned cargo-near build for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          tarball=cargo-near-${target}.tar.gz
          curl --proto '=https' --tlsv1.2 -LsSfO \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/${tarball}"
          if [ "$RUNNER_OS" = macOS ]; then
            # Darwin's sha256sum has no --check --strict.
            echo "${sha256}  ${tarball}" | shasum -a 256 --check --strict
          else
            echo "${sha256}  ${tarball}" | sha256sum --check --strict
          fi
          tar xzf "$tarball"
          # Not $HOME/.cargo/bin: on a CI pool runner that directory is shared
          # and outlives this job.
          bin="$RUNNER_TEMP/cargo-near-bin"
          mkdir -p "$bin"
          install -m 0755 "cargo-near-${target}/cargo-near" "$bin/cargo-near"
          echo "$bin" >> "$GITHUB_PATH"
          PATH="$bin:$PATH" cargo near --version
      # The reproducible build needs a Docker daemon that can bind-mount
      # RUNNER_TEMP. GitHub-hosted runners have one. On a CI pool runner it
      # is pool setup that lives outside this repo. Fail here rather than
      # deep inside cargo-near.
      - name: Check the runner's Docker daemon
        if: runner.environment == 'self-hosted'
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::No reachable Docker daemon on CI pool runner '${RUNNER_NAME}'. Start the pool's Docker service and re-run; the reproducible wasm build runs in a container."
            exit 1
          fi
          if ! docker run --rm -v "$RUNNER_TEMP:/probe:ro" alpine:3 test -d /probe >/dev/null 2>&1; then
            echo "::error::Docker on '${RUNNER_NAME}' cannot bind-mount ${RUNNER_TEMP}. Share that directory with the pool's Docker daemon and re-run."
            exit 1
          fi
      # CI pool runners share a Docker daemon. A run whose runner died skips
      # the always() cleanup below. Reclaim this job's orphaned build
      # containers before building. Same instance-scoped RUNNER_TEMP filter.
      - name: Remove orphaned cargo-near build containers
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          for id in $(docker ps -aq --filter name=near-verify-rs-); do
            if docker inspect -f '{{range .Mounts}}{{println .Source}}{{end}}' "$id" 2>/dev/null \
              | grep -qF "$RUNNER_TEMP/"; then
              docker rm -f "$id" || true
            fi
          done
      - name: Build in the pinned cargo-near image
        working-directory: contracts/approval/contract
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # On macOS the pinned image is linux/amd64 only, so it runs under
            # emulation (same image digest, same toolchain, same wasm).
            export DOCKER_DEFAULT_PLATFORM=linux/amd64
          fi
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            # cargo-near bind-mounts a temporary clone of the repo into the
            # container; keep that clone under RUNNER_TEMP, which the runner
            # cleans and the cleanup step below matches on.
            export TMPDIR="$RUNNER_TEMP"
          fi
          cargo near build reproducible-wasm
      # A cancelled run (concurrency cancels superseded pushes) can leave
      # cargo-near's build container running on a CI pool runner. Remove
      # only containers whose bind mount is this job's RUNNER_TEMP.
      - name: Remove leftover cargo-near build containers
        if: always() && runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          for id in $(docker ps -aq --filter name=near-verify-rs-); do
            if docker inspect -f '{{range .Mounts}}{{println .Source}}{{end}}' "$id" 2>/dev/null \
              | grep -qF "$RUNNER_TEMP/"; then
              docker rm -f "$id" || true
            fi
          done
      - name: Report the wasm hash
        run: |
          wasm=target/near/approval_contract/approval_contract.wasm
          hex=$(sha256sum "$wasm" | cut -d' ' -f1)
          echo "approval_contract.wasm sha256: $hex" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Compare with the base58 \`code_hash\` of a deployed account to verify it." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approval-contract-wasm
          path: |
            contracts/approval/target/near/approval_contract/approval_contract.wasm
            contracts/approval/target/near/approval_contract/approval_contract_abi.json
          if-no-files-found: error

  sandbox:
    name: sandbox tests
    needs: wasm
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # On a CI pool runner, install the pin and select it for this job only,
      # so the job does not change the runner's default toolchain.
      - name: Install the pinned Rust toolchain for this job
        if: runner.environment == 'self-hosted'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: runner.environment == 'github-hosted'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # rust-cache's post step prunes CARGO_HOME. A CI pool runner's
      # CARGO_HOME is shared and already persists, so only use rust-cache
      # on GitHub-hosted runners.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: contracts/approval
          key: sandbox
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approval-contract-wasm
          path: contracts/approval/artifact
      - name: Hash-checked near-sandbox
        working-directory: ${{ github.workspace }}
        run: |
          # near-workspaces downloads in its build script, before any test
          # runs, and reuses a cache that has no hash. Point it at the
          # sha256-checked binary and drop a copy fetched earlier.
          bin=$(scripts/near/sandbox.sh bin)
          echo "NEAR_SANDBOX_BIN_PATH=$bin" >> "$GITHUB_ENV"
      - name: Run sandbox tests against the reproducible wasm
        env:
          APPROVAL_WASM: ${{ github.workspace }}/contracts/approval/artifact/approval_contract.wasm
        run: |
          ulimit -n 65535
          cargo test -p approval-sandbox-tests --locked -- --nocapture
